<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>云舒 · 天气台风智能助手</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: linear-gradient(145deg, #f0f7ff 0%, #e6f0fa 100%); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        #app { width: 100%; max-width: 900px; height: 100%; max-height: 800px; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 32px; box-shadow: 0 20px 40px rgba(0, 20, 50, 0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.5); }
        .chat-header { padding: 18px 24px; border-bottom: 1px solid rgba(180, 200, 230, 0.3); background: rgba(255, 255, 255, 0.3); }
        .chat-header h2 { font-size: 1.6rem; font-weight: 350; color: #1a3e60; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .message-container { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; background: rgba(255, 255, 255, 0.2); }
        .message-item { display: flex; flex-direction: column; max-width: 85%; }
        .message-user { align-self: flex-end; }
        .message-ai { align-self: flex-start; }
        .message-bubble { padding: 14px 18px; border-radius: 24px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02); }
        .message-user .message-bubble { background: #d4e7ff; color: #1a3e60; border-bottom-right-radius: 6px; border: 1px solid rgba(90, 140, 200, 0.2); }
        .message-ai .message-bubble { background: #ffffff; color: #2c3e50; border-bottom-left-radius: 6px; border: 1px solid rgba(200, 220, 240, 0.5); }
        .message-time { font-size: 0.7rem; color: #7f8c8d; margin-top: 4px; padding: 0 8px; }
        .message-user .message-time { text-align: right; }
        .loading-dots { display: flex; gap: 6px; padding: 8px 0; }
        .loading-dots span { width: 8px; height: 8px; background: #7f9cbb; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .input-area { padding: 18px 24px 24px; background: rgba(255, 255, 255, 0.5); border-top: 1px solid rgba(180, 200, 230, 0.3); backdrop-filter: blur(8px); }
        .mode-selector { margin-bottom: 16px; display: flex; justify-content: center; }
        .el-radio-group { background: rgba(220, 235, 250, 0.5); padding: 5px; border-radius: 40px; }
        .el-radio-button__inner { border-radius: 30px !important; background: transparent; border: none !important; box-shadow: none !important; color: #2c3e50; font-weight: 450; padding: 8px 22px; }
        .el-radio-button__original-radio:checked + .el-radio-button__inner { background: #ffffff !important; color: #1a3e60 !important; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05) !important; }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }
        .el-textarea { flex: 1; }
        .el-textarea__inner { border-radius: 28px !important; padding: 12px 20px !important; background: rgba(255, 255, 255, 0.9) !important; border: 1px solid rgba(120, 160, 200, 0.2) !important; resize: none; font-size: 0.95rem; line-height: 1.4; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02); }
        .el-textarea__inner:focus { border-color: #7fafdf !important; background: white !important; }
        .send-btn { border-radius: 40px !important; padding: 12px 28px !important; background: #5f9bd0 !important; border: none !important; color: white !important; font-weight: 500; letter-spacing: 1px; box-shadow: 0 8px 16px rgba(80, 130, 200, 0.2) !important; transition: all 0.2s; }
        .send-btn:hover { background: #4a87c0 !important; transform: translateY(-2px); box-shadow: 0 12px 20px rgba(80, 130, 200, 0.25) !important; }
        .message-container::-webkit-scrollbar { width: 5px; }
        .message-container::-webkit-scrollbar-thumb { background: rgba(100, 140, 180, 0.3); border-radius: 10px; }
        .message-container::-webkit-scrollbar-track { background: transparent; }
        .welcome-tip { color: #5c7f9c; text-align: center; margin-top: 20px; font-style: italic; }
        .file-select-area { display: flex; align-items: center; margin-bottom: 12px; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.6); border: 1px dashed #b0c4de; }
        .file-name { flex: 1; margin-left: 10px; color: #2c3e50; }
        .file-btn { padding: 6px 16px; background: #5f9bd0; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="app">
        <div class="chat-header">
            <h2><span>☁️ 云舒 · 气象小筑</span></h2>
        </div>
        <div class="message-container" ref="messageContainer">
            <div v-if="messages.length === 0" class="welcome-tip">🌱 嗨，我是云舒～ 问我天气、台风都可以呀！</div>
            <div v-for="(msg, index) in messages" :key="index" class="message-item" :class="msg.role === 'user' ? 'message-user' : 'message-ai'">
                <div class="message-bubble" v-if="msg.isHtml" v-html="msg.content"></div>
                <div class="message-bubble" v-else>{{ msg.content }}</div>
                <div class="message-time">{{ msg.time }}</div>
            </div>
            <div v-if="isLoading" class="message-item message-ai">
                <div class="message-bubble">
                    <div class="loading-dots"><span></span><span></span><span></span></div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="mode-selector">
                <el-radio-group v-model="mode" size="large">
                    <el-radio-button label="qa">💬 智能问答</el-radio-button>
                    <el-radio-button label="predict">📈 台风预测</el-radio-button>
                    <el-radio-button label="map">🗺️ 路径预测</el-radio-button>
                </el-radio-group>
            </div>

            <!-- 智能问答 / 台风预测 通用输入框 -->
            <div v-if="mode !== 'map'" class="input-row">
                <el-input v-model="inputText" type="textarea" :rows="1"
                    :placeholder="mode === 'qa' ? '问我天气、台风都可以哦～' : '想预测什么时候的台风？比如「明年台风多吗」'"
                    @keydown.enter.prevent="sendMessage" resize="none" />
                <el-button class="send-btn" @click="sendMessage" :loading="isLoading">发送</el-button>
            </div>

            <!-- 路径预测模式 -->
            <div v-if="mode === 'map'">
                <!-- 文件选择 -->
                <div class="file-select-area">
                    <button class="file-btn" @click="openFileDialog">📁 选择 NetCDF 文件</button>
                    <div class="file-name" v-if="draggedFile">{{ draggedFile.name }}</div>
                    <div class="file-name" v-else style="color: #7f8c8d;">未选择文件（可选）</div>
                </div>
                <input type="file" ref="fileInput" style="display: none" accept=".nc" @change="onFileSelected" />

                <!-- 坐标输入框 -->
                <el-input
                    v-model="trackInput"
                    type="textarea"
                    :rows="3"
                    placeholder="可选：输入6个坐标点（每行格式：纬度,经度），留空则使用文件内置坐标"
                    @keydown.enter.prevent="sendMapPredict"
                    resize="none"
                />
                <div style="margin-top: 6px; font-size: 0.8rem; color: #7f8c8d; text-align: center;">
                    选择文件后直接按 <strong>Enter</strong> 进行预测，或输入坐标后按 <strong>Enter</strong>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const { createApp, ref, nextTick } = Vue;
        const app = createApp({
            setup() {
                const mode = ref('qa');
                const inputText = ref('');
                const trackInput = ref('');
                const messages = ref([]);
                const isLoading = ref(false);
                const messageContainer = ref(null);
                const draggedFile = ref(null);
                const fileInput = ref(null);

                const getCurrentTime = () => {
                    const now = new Date();
                    return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                };
                const scrollToBottom = async () => {
                    await nextTick();
                    if (messageContainer.value) {
                        messageContainer.value.scrollTop = messageContainer.value.scrollHeight;
                    }
                };

                const openFileDialog = () => fileInput.value.click();

                const onFileSelected = (event) => {
                    const files = event.target.files;
                    if (files.length > 0) {
                        if (!files[0].name.endsWith('.nc')) {
                            alert('请选择 .nc 格式的文件哦～');
                            return;
                        }
                        draggedFile.value = files[0];
                    }
                };

                const sendMessage = async () => {
                    const question = inputText.value.trim();
                    if (!question) return;
                    messages.value.push({ role: 'user', content: question, time: getCurrentTime() });
                    inputText.value = '';
                    await scrollToBottom();
                    isLoading.value = true;
                    try {
                        const resp = await axios.post('/api/query', {
                            question: question,
                            type: mode.value
                        }, { timeout: 30000 });
                        const answer = resp.data.code === 200 ? resp.data.data : `出错啦：${resp.data.msg}`;
                        messages.value.push({ role: 'ai', content: answer, time: getCurrentTime() });
                    } catch (e) {
                        messages.value.push({ role: 'ai', content: '网络错误，请检查后端是否启动。', time: getCurrentTime() });
                    } finally {
                        isLoading.value = false;
                        await scrollToBottom();
                    }
                };

                const sendMapPredict = async () => {
                    // 情况1：有文件 → 伏羲全套预测
                    if (draggedFile.value) {
                        const coords = trackInput.value.trim();
                        const formData = new FormData();
                        formData.append('file', draggedFile.value);
                        formData.append('coords', coords);  // 可以是空
                        isLoading.value = true;
                        messages.value.push({ role: 'user', content: `已选择文件：${draggedFile.value.name}，正在预测...`, time: getCurrentTime() });
                        const file = draggedFile.value;
                        draggedFile.value = null;
                        trackInput.value = '';
                        await scrollToBottom();
                        try {
                            const resp = await axios.post('/api/typhoon/fuxi_demo', formData, {
                                timeout: 120000,
                                headers: { 'Content-Type': 'multipart/form-data' }
                            });
                            if (resp.data.code === 200) {
                                messages.value.push({ role: 'ai', content: resp.data.data.answer, time: getCurrentTime() });
                                if (resp.data.data.intensity_image) {
                                    messages.value.push({
                                        role: 'ai',
                                        content: `<img src="data:image/png;base64,${resp.data.data.intensity_image}" style="max-width:100%;"/>`,
                                        time: getCurrentTime(),
                                        isHtml: true
                                    });
                                }
                                if (resp.data.data.map_image) {
                                    messages.value.push({
                                        role: 'ai',
                                        content: `<img src="data:image/png;base64,${resp.data.data.map_image}" style="max-width:100%;"/>`,
                                        time: getCurrentTime(),
                                        isHtml: true
                                    });
                                }
                            } else {
                                messages.value.push({ role: 'ai', content: '预测失败：' + resp.data.msg, time: getCurrentTime() });
                            }
                        } catch (e) {
                            messages.value.push({ role: 'ai', content: '请求失败，请确认WSL中的伏羲服务已启动。', time: getCurrentTime() });
                        } finally {
                            isLoading.value = false;
                            await scrollToBottom();
                        }
                        return;
                    }

                    // 情况2：没有文件，但输入了坐标 → 相似路径预测
                    const track = trackInput.value.trim();
                    if (!track) {
                        alert('请先选择 .nc 文件，或在文本框中输入至少6个坐标点。');
                        return;
                    }
                    const lines = track.split('\n').filter(l => l.trim() !== '');
                    if (lines.length < 6) {
                        alert('至少需要6个轨迹点，当前只有 ' + lines.length + ' 个。');
                        return;
                    }
                    messages.value.push({ role: 'user', content: `路径预测输入：\n${track}`, time: getCurrentTime() });
                    trackInput.value = '';
                    await scrollToBottom();
                    isLoading.value = true;
                    try {
                        const formData = new FormData();
                        formData.append('track', track);
                        const resp = await axios.post('/api/typhoon/map_predict', formData, {
                            timeout: 60000,
                            headers: { 'Content-Type': 'multipart/form-data' }
                        });
                        if (resp.data.code === 200) {
                            messages.value.push({ role: 'ai', content: resp.data.data.answer, time: getCurrentTime() });
                            if (resp.data.data.map_base64) {
                                messages.value.push({
                                    role: 'ai',
                                    content: `<img src="data:image/png;base64,${resp.data.data.map_base64}" style="max-width:100%;"/>`,
                                    time: getCurrentTime(),
                                    isHtml: true
                                });
                            }
                        } else {
                            messages.value.push({ role: 'ai', content: '预测失败：' + resp.data.msg, time: getCurrentTime() });
                        }
                    } catch (e) {
                        messages.value.push({ role: 'ai', content: '路径预测请求失败。', time: getCurrentTime() });
                    } finally {
                        isLoading.value = false;
                        await scrollToBottom();
                    }
                };

                return {
                    mode, inputText, trackInput, messages, isLoading, messageContainer,
                    draggedFile, fileInput,
                    openFileDialog, onFileSelected,
                    sendMessage, sendMapPredict
                };
            }
        });
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
