version: '3.8'

services:
  yunshu:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 数据库配置（使用 compose 内的 MySQL 服务）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: yunshu123
      MYSQL_DB: weather_db
      # DeepSeek API Key（请在这里填写或通过 .env 文件传入）
      DEEPSEEK_API_KEY: your_api_key_here
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      # 模型路径（如果挂载了模型）
      FUXI_MODEL_DIR: /app/FuXi_EC
      # 管理员密钥
      ADMIN_SECRET: 123456
      # HuggingFace 离线模式（启动时会自动下载所需模型，第一次需联网）
      HF_HUB_OFFLINE: 0
    volumes:
      # 挂载模型文件夹（可选，如果老师有模型文件，可以放在 ./FuXi_EC 目录）
      - ./FuXi_EC:/app/FuXi_EC
      # 持久化 Chroma 向量库（避免每次重启重建）
      - ./data/chroma:/app/backend/chroma_weather_index
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yunshu123
      MYSQL_DATABASE: weather_db
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 可选的初始化 SQL 文件（如果需要自动导入数据，可以放入 init.sql）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped